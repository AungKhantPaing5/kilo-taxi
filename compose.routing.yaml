services:
  taxi:
    environment:
      OSRM_URL: http://osrm:5000
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--threads", "2", "/data/myanmar-latest.osrm"]
    volumes:
      - ./routing-data:/data:ro
    expose:
      - "5000"
    mem_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
